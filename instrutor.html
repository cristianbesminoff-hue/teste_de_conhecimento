<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova Técnica Unifique - Instrutor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1d1d4f;--mu:#666a8a;--ac:#00aeef;--bd:#d8dcec;--ok:#1e9e5a;--er:#d6364a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122a;--card:#1a1d3d;--tx:#eef0ff;--mu:#a3a8cc;--bd:#33376a}}
:root[data-theme="dark"]{--bg:#10122a;--card:#1a1d3d;--tx:#eef0ff;--mu:#a3a8cc;--bd:#33376a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.5rem;margin:0 0 8px;color:var(--ac)}
p{color:var(--mu)}
button{font:inherit;cursor:pointer}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx)}
.sm{display:inline-block;width:auto;padding:6px 12px;margin:6px 6px 0 0;font-size:.9rem}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-weight:700;width:100%;margin-top:12px}
.go:disabled{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt.sel{border-color:var(--ac);background:rgba(0,174,239,.12)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 8px}
.big{font-size:3rem;font-weight:800;margin:4px 0}
.ok{color:var(--ok)}.er{color:var(--er)}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}
.hide{display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body><main>
<div id="lg" class="card"><h1>Área do instrutor</h1><p>Digite a senha para entrar.</p>
<input id="pw" type="password" placeholder="Senha"><button class="go" id="en">Entrar</button><p id="er" class="er"></p></div>
<div id="pn" class="card hide"><h1>Painel do instrutor</h1><p id="as"></p><div id="al"></div></div>
</main><script>
const CFG={apiKey:"AIzaSyCIvffrClPs-qR-WqVNirr8-n7LqsjGtio",authDomain:"prova-de-instrucao.firebaseapp.com",databaseURL:"https://prova-de-instrucao-default-rtdb.firebaseio.com",projectId:"prova-de-instrucao",appId:"1:720424141498:web:ac9557168acf5a37a2f883"};
const SENHA="102030";
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1=x=>x.toFixed(1).replace(".",",");
let DB=null,D={};
function rend(){const ids=Object.keys(D).sort((a,b)=>(D[a].ts||0)-(D[b].ts||0));
 const T=i=>Object.values(D[i].tentativas||{}),fez=ids.filter(i=>T(i).length),ap=fez.filter(i=>T(i).some(x=>x.n>=8));
 $("as").textContent=`${ids.length} aluno(s) · ${ids.filter(i=>D[i].status==="aprovado").length} liberado(s) · ${fez.length} fizeram a prova · ${ap.length} aprovado(s)`;
 $("al").innerHTML=ids.length?ids.map(i=>{const r=D[i],t=T(i),st=r.status;
 return `<div class="rev"><b>${esc(r.nome)}</b> · <i>${st==="aprovado"?"Liberado":st==="negado"?"Negado":"Aguardando"}</i><br>`+
 (t.length?t.map(x=>`<span class="${x.n>=8?"ok":"er"}">${f1(x.n)} (${x.h}/20)</span>`).join(" · "):`<span style="color:var(--mu)">Sem prova feita</span>`)+
 `<br><button class="opt sm" data-i="${i}" data-s="aprovado">Aprovar entrada</button><button class="opt sm" data-i="${i}" data-s="negado">Negar</button><button class="opt sm" data-i="${i}" data-s="x">Excluir</button></div>`}).join(""):`<p>Nenhum aluno solicitou entrada ainda.</p>`}
$("en").onclick=()=>{if($("pw").value!==SENHA){$("er").textContent="Senha incorreta.";return}
 if(CFG.apiKey.startsWith("COLE")){$("er").textContent="Configure o Firebase no arquivo (CFG).";return}
 try{if(!firebase.apps.length)firebase.initializeApp(CFG);DB=firebase.database()}catch(e){$("er").textContent="Erro ao conectar ao banco.";return}
 $("lg").classList.add("hide");$("pn").classList.remove("hide");
 DB.ref("alunos").on("value",q=>{D=q.val()||{};rend()})};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("en").click()};
$("al").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const r=DB.ref("alunos/"+b.dataset.i);
 if(b.dataset.s==="x"){if(confirm("Excluir este aluno?"))r.remove()}else r.update({status:b.dataset.s})};
</script></body></html>
