<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova Técnica Unifique - Instrutor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1d1d4f;--mu:#666a8a;--ac:#00aeef;--bd:#d8dcec;--ok:#1e9e5a;--er:#d6364a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122a;--card:#1a1d3d;--tx:#eef0ff;--mu:#a3a8cc;--bd:#33376a}}
:root[data-theme="dark"]{--bg:#10122a;--card:#1a1d3d;--tx:#eef0ff;--mu:#a3a8cc;--bd:#33376a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.5rem;margin:0 0 8px;color:var(--ac)}
p{color:var(--mu)}
button{font:inherit;cursor:pointer}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx)}
.sm{display:inline-block;width:auto;padding:6px 12px;margin:6px 6px 0 0;font-size:.9rem}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-weight:700;width:100%;margin-top:12px}
.go:disabled{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt.sel{border-color:var(--ac);background:rgba(0,174,239,.12)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 8px}
.big{font-size:3rem;font-weight:800;margin:4px 0}
.ok{color:var(--ok)}.er{color:var(--er)}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}
.hide{display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body><main>
<div id="lg" class="card"><h1>Área do instrutor</h1><p>Digite a senha para entrar.</p>
<input id="pw" type="password" placeholder="Senha"><button class="go" id="en">Entrar</button><p id="er" class="er"></p></div>
<div id="pn" class="card hide"><h1>Painel do instrutor</h1><p id="as"></p><div id="tp"></div><div id="al"></div></div>
</main><script>
const CFG={apiKey:"AIzaSyCIvffrClPs-qR-WqVNirr8-n7LqsjGtio",authDomain:"prova-de-instrucao.firebaseapp.com",databaseURL:"https://prova-de-instrucao-default-rtdb.firebaseio.com",projectId:"prova-de-instrucao",appId:"1:720424141498:web:ac9557168acf5a37a2f883"};
const SENHA="102030";
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1=x=>x.toFixed(1).replace(".",",");
const dt=x=>new Date(x).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
let DB=null,D={};
const TT=r=>Object.values(r.tentativas||{}).sort((a,b)=>a.t-b.t);
const wrong=x=>x.resp?Object.values(x.resp).filter(y=>y.r!==y.c):Object.values(x.erros||{});
const bx=(ok,k,y)=>`<div style="margin:8px 0 0 8px;padding:8px 10px;border-left:4px solid var(--${ok?"ok":"er"});background:${ok?"rgba(30,158,90,.12)":"rgba(214,54,74,.12)"};border-radius:6px;font-size:.88rem"><b>${k}${esc(y.q)}</b><br>`+(ok?`<span class="ok">✔ ${esc(y.c)}</span>`:`<span class="er">✘ Respondeu: ${esc(y.r)}</span><br><span class="ok">✔ Correta: ${esc(y.c)}</span>`)+`</div>`;
const att=x=>{const R=Object.values(x.resp||{});
 const body=R.length?R.map((y,k)=>bx(y.r===y.c,(k+1)+". ",y)).join(""):wrong(x).length?wrong(x).map(y=>bx(false,"",y)).join(""):x.h<20?`<div style="margin:8px 0 0 8px;color:var(--mu)">Sem detalhes desta tentativa.</div>`:`<div class="ok" style="margin:8px 0 0 8px">Gabaritou, nenhum erro.</div>`;
 return `<details style="margin:6px 0"><summary class="${x.n>=8?"ok":"er"}" style="cursor:pointer"><b>${f1(x.n)}</b> (${x.h}/${R.length||20}) · ${x.n>=8?"Aprovado":"Reprovado"} · ${dt(x.t)}</summary>${body}</details>`};
const bt=(a,i,t)=>`<button class="opt sm" data-a="${a}" data-i="${i}">${t}</button>`;
const sec=(t,a,f)=>a.length?`<h3 style="margin:18px 0 4px">${t} (${a.length})</h3>`+a.map(f).join(""):"";
function rend(){const ids=Object.keys(D).sort((a,b)=>D[a].ts-D[b].ts),st=i=>D[i].status;
 const P=ids.filter(i=>!["liberada","enviada","encerrado"].includes(st(i))),F=ids.filter(i=>st(i)==="liberada"),R=ids.filter(i=>st(i)==="enviada"),E=ids.filter(i=>st(i)==="encerrado");
 $("as").textContent=`${P.length} aguardando · ${F.length} fazendo a prova · ${R.length} com resultado · ${E.length} encerrado(s)`;
 const M={};ids.forEach(i=>TT(D[i]).forEach(a=>wrong(a).forEach(y=>M[y.q]=(M[y.q]||0)+1)));
 const tp=Object.entries(M).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $("tp").innerHTML=tp.length?`<details class="rev"><summary><b>Questões mais erradas da turma</b></summary>`+tp.map(([q,c])=>`<div style="margin-top:6px;font-size:.88rem">${c}× · ${esc(q)}</div>`).join("")+`</details>`:"";
 $("al").innerHTML=ids.length?
 sec("Aguardando aprovação",P,i=>`<div class="rev"><b>${esc(D[i].nome)}</b>${st(i)==="negado"?" · <i>Negado</i>":""}<br>${bt("ap",i,"Aprovar entrada")}${st(i)==="negado"?"":bt("ng",i,"Negar")}</div>`)+
 sec("Fazendo a prova",F,i=>`<div class="rev"><b>${esc(D[i].nome)}</b> · <i>respondendo… (prova ${D[i].rodada||1})</i></div>`)+
 sec("Resultados",R,i=>{const r=D[i],t=TT(r),l=t[t.length-1];if(!l)return `<div class="rev"><b>${esc(r.nome)}</b> · <i>recebendo dados…</i></div>`;const ap=l.n>=8;
  return `<div class="rev"><b>${esc(r.nome)}</b> · <span class="${ap?"ok":"er"}"><b>${f1(l.n)}</b> · ${ap?"Aprovado":"Reprovado"}</span> · ${t.length} tentativa(s)${t.map(att).join("")}`+(ap?bt("pdf",i,"Imprimir PDF")+bt("enc",i,"Encerrar cadastro"):bt("nova",i,"Refazer: gerar nova prova"))+`</div>`})+
 sec("Cadastros encerrados",E,i=>{const t=TT(D[i]),l=t[t.length-1];return `<div class="rev"><b>${esc(D[i].nome)}</b> · <span class="ok">${l?f1(l.n):""}</span><br>${bt("pdf",i,"Imprimir PDF")}${bt("del",i,"Excluir")}</div>`})
 :"<p>Nenhum aluno solicitou entrada ainda.</p>"}
function imprimir(i){const r=D[i],t=TT(r),l=[...t].reverse().find(x=>x.n>=8)||t[t.length-1];if(!l)return;const R=Object.values(l.resp||{});
 const w=window.open("","_blank");if(!w){alert("Libere os pop-ups do navegador para imprimir.");return}
 w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Comprovante - ${esc(r.nome)}</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:28px auto;padding:0 18px;color:#1d1d4f;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{color:#00aeef;margin-bottom:4px}.k{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap}.k div{border:1px solid #ccd;border-radius:10px;padding:8px 14px}.k b{display:block;font-size:1.4rem}.q{margin:6px 0;padding:6px 10px;border-left:4px solid;font-size:.88rem;break-inside:avoid}.g{border-color:#1e9e5a;background:#e8f6ee}.e{border-color:#d6364a;background:#fdeaec}.s{display:flex;gap:40px;margin-top:60px}.s div{flex:1;border-top:1px solid #333;text-align:center;padding-top:4px;font-size:.85rem}</style><h1>Comprovante de aprovação</h1><p>Treinamento de Instalação e Manutenção · Unifique</p><p>Aluno: <b>${esc(r.nome)}</b></p><div class="k"><div>Nota<b>${f1(l.n)}</b></div><div>Acertos<b>${l.h}/${R.length||20}</b></div><div>Data<b style="font-size:1rem">${dt(l.t)}</b></div><div>Tentativas<b>${t.length}</b></div></div><h3>Prova realizada</h3>`+
 (R.length?R.map((y,k)=>`<div class="q ${y.r===y.c?"g":"e"}"><b>${k+1}. ${esc(y.q)}</b><br>${y.r===y.c?"✔ "+esc(y.c):"✘ Respondeu: "+esc(y.r)+"<br>✔ Correta: "+esc(y.c)}</div>`).join(""):"<p>Sem detalhes.</p>")+`<div class="s"><div>Instrutor</div><div>Aluno</div></div>`);
 w.document.close();w.focus();setTimeout(()=>w.print(),400)}
$("en").onclick=()=>{if($("pw").value!==SENHA){$("er").textContent="Senha incorreta.";return}
 if(CFG.apiKey.startsWith("COLE")){$("er").textContent="Configure o Firebase no arquivo (CFG).";return}
 try{firebase.initializeApp(CFG);DB=firebase.database()}catch(e){$("er").textContent="Erro ao conectar ao banco.";return}
 $("lg").classList.add("hide");$("pn").classList.remove("hide");
 DB.ref("alunos").on("value",q=>{D=q.val()||{};rend()})};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("en").click()};
$("al").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const i=b.dataset.i,a=b.dataset.a,r=DB.ref("alunos/"+i),x=D[i]||{};
 if(a==="ap")r.update({status:"liberada",rodada:(x.rodada||0)+1,atual:null});
 else if(a==="nova"){if(confirm("Gerar uma nova prova com 20 questões diferentes para este aluno?"))r.update({status:"liberada",rodada:(x.rodada||0)+1,atual:null})}
 else if(a==="ng")r.update({status:"negado"});
 else if(a==="enc"){if(confirm("Encerrar o cadastro deste aluno?"))r.update({status:"encerrado"})}
 else if(a==="pdf")imprimir(i);
 else if(a==="del"){if(confirm("Excluir este aluno?"))r.remove()}};
</script></body></html>
