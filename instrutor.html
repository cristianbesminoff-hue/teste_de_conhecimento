<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Instrutor - Prova Técnica</title>
<style>
:root{box-sizing:border-box;--bg:#f5f7fb;--card:#fff;--tx:#1d1d4f;--mu:#666a8a;--ac:#00aeef;--bd:#d8dcec;--ok:#1e9e5a;--er:#d6364a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;line-height:1.45}
main{max-width:800px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
h1,h2{color:var(--ac);margin-top:0}
button{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;display:inline-block;text-align:center}
button.danger{background:var(--er)}
button.ok-btn{background:var(--ok)}
button.pdf-btn{background:#e74c3c}
.row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.item{border-bottom:1px solid var(--bd);padding:12px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.item:last-child{border-bottom:0}

/* Estilo específico para impressão/PDF */
@media print {
  body { background: #fff; color: #000; }
  button, .row { display: none !important; }
  .card { border: none; padding: 0; box-shadow: none; }
}
</style>
</head>
<body>
<main>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <h1>Painel do Instrutor</h1>
        <p>Aprove ou recuse o acesso dos alunos e consulte os resultados.</p>
      </div>
      <button class="pdf-btn" onclick="exportarPDF()">🖨️ Exportar Relatório (PDF)</button>
    </div>
    
    <div id="lista-alunos" style="margin-top:20px;">A carregar alunos…</div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// --- PROTEÇÃO DE SENHA DO INSTRUTOR ---
const senhaInformada = prompt("Painel Restrito. Digite a senha do instrutor:");
if (senhaInformada !== "102030") {
  alert("Senha incorreta ou acesso negado.");
  window.location.href = "index.html";
}

const CFG = {apiKey:"AIzaSyCIvffrClPs-qR-WqVNirr8-n7LqsjGtio",authDomain:"prova-de-instrucao.firebaseapp.com",databaseURL:"https://prova-de-instrucao-default-rtdb.firebaseio.com",projectId:"prova-de-instrucao",appId:"1:720424141498:web:ac9557168acf5a37a2f883"};
firebase.initializeApp(CFG);
const DB = firebase.database();

let dadosAlunosGlobais = {};

// --- GESTÃO DE ALUNOS ---
DB.ref("alunos").on("value", snapshot => {
  const dados = snapshot.val();
  const container = document.getElementById("lista-alunos");
  container.innerHTML = "";
  
  if (!dados) {
    container.textContent = "Nenhum aluno registado ainda.";
    dadosAlunosGlobais = {};
    return;
  }
  
  dadosAlunosGlobais = dados;

  Object.keys(dados).forEach(id => {
    const a = dados[id];
    const div = document.createElement("div");
    div.className = "item";
    
    let infoExtra = `Status: <b>${a.status}</b>`;
    if(a.status === "concluido") {
      infoExtra += ` | Acertos: <b>${a.acertos}/${a.total}</b> (${a.percentual}%)`;
    }

    div.innerHTML = `
      <div>
        <b>${a.nome}</b><br>
        <small>${infoExtra}</small>
      </div>
      <div>
        ${a.status !== 'aprovado' ? `<button class="ok-btn" onclick="setStatus('${id}', 'aprovado')">Aprovar</button>` : ''}
        ${a.status !== 'negado' ? `<button class="danger" onclick="setStatus('${id}', 'negado')">Negar</button>` : ''}
        <button class="danger" onclick="removerAluno('${id}')" style="background:#555">Excluir</button>
      </div>
    `;
    container.appendChild(div);
  });
});

function setStatus(id, st) { DB.ref("alunos/" + id + "/status").set(st); }
function removerAluno(id) { if(confirm("Deseja remover este registo de aluno?")) DB.ref("alunos/" + id).remove(); }

function exportarPDF() {
  window.print(); // Abre a janela nativa do navegador permitindo guardar diretamente como PDF ou imprimir
}
</script>
</body>
</html>
