<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova Técnica Unifique - Aluno</title>
<style>
:root{box-sizing:border-box;--bg:#f5f7fb;--card:#fff;--tx:#1d1d4f;--mu:#666a8a;--ac:#00aeef;--bd:#d8dcec;--ok:#1e9e5a;--er:#d6364a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;line-height:1.45}
main{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
h1,h2{color:var(--ac);margin-top:0}
button{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:700;width:100%;text-align:center;margin-top:10px}
button:disabled{background:var(--mu);opacity:0.6;cursor:not-allowed}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;margin-bottom:10px}
.opt{background:var(--bg);border:1px solid var(--bd);padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:0.2s}
.opt:hover{border-color:var(--ac);background:#eef9ff}
.opt.selected{background:var(--ac);color:#fff;border-color:var(--ac)}
.hide{display:none}
.center{text-align:center}
.badge{background:var(--bg);padding:4px 8px;border-radius:4px;font-size:0.85rem;color:var(--mu)}
</style>
</head>
<body>
<main>
  <!-- ECRÃ DE IDENTIFICAÇÃO -->
  <div id="ecra-id" class="card">
    <h1>Prova Técnica Unifique</h1>
    <p>Identifique-se para iniciar a avaliação. O instrutor precisa de aprovar o seu acesso.</p>
    <input type="text" id="input-nome" placeholder="Digite o seu Nome Completo">
    <div class="badge" id="nq">A carregar questões...</div>
    <button id="bs" onclick="registarAluno()" disabled>A carregar...</button>
    <div id="msg-status" class="center" style="margin-top:12px;font-weight:600;color:var(--mu)"></div>
  </div>

  <!-- ECRÃ DA PROVA -->
  <div id="ecra-prova" class="card hide">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span id="progresso" class="badge">Questão 1 de 20</span>
      <span id="temporizador" class="badge">⏱️</span>
    </div>
    <h2 id="enunciado">A carregar pergunta...</h2>
    <div id="container-opcoes"></div>
    <button id="btn-responder" onclick="proximaQuestao()" class="hide">Seguinte</button>
  </div>

  <!-- ECRÃ DE RESULTADO -->
  <div id="ecra-resultado" class="card hide center">
    <h1>Prova Concluída!</h1>
    <p id="texto-resultado"></p>
    <button onclick="window.location.reload()">Terminar / Sair</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
