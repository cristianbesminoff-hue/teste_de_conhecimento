const Q=RAW.split("\n").map(l=>l.split("|")).filter(a=>a.length==6);

function pick(prev){const seen=new Set(prev.map(x=>x.q)),bad=new Set(prev.filter(x=>x.r!==x.c).map(x=>x.q));
 const fresh=sh(Q.filter(a=>!seen.has(a[0])));if(fresh.length>=20)return fresh.slice(0,20).map(a=>a[0]);
 const old=sh(Q.filter(a=>seen.has(a[0]))).sort((a,b)=>(bad.has(b[0])?1:0)-(bad.has(a[0])?1:0));
 return fresh.concat(old).slice(0,20).map(a=>a[0])}

function launch(){run=true;const at=R0.atual;let qs,ans=[];
 if(at&&at.rodada===R0.rodada){qs=Object.values(at.qs);ans=Object.values(at.ans||{})}
 else{qs=pick(Object.values(R0.tentativas||{}).flatMap(t=>Object.values(t.resp||t.erros||{})));DB.ref("alunos/"+ID+"/atual").set({rodada:R0.rodada,qs})}
 T=mk(qs);i=0;hits=0;all=[];
 ans.forEach((r,k)=>{if(T[k]){all.push({q:T[k].q,r,c:T[k].c});if(r===T[k].c)hits++;i++}});
 begin()}
function end(){const n=hits/N*10;

 show("gate");gmsg("Enviando suas respostas…",false);$("gt").classList.add("hide");
 const k=DB.ref("alunos/"+ID+"/tentativas").push().key,u={};
 u["tentativas/"+k]={n,h:hits,t:Date.now(),rodada:R0.rodada||1,resp:all.map(e=>({q:e.q,r:e.r||"",c:e.c}))};u.status="enviada";u.atual=null;

function gupd(){if(run)return;const s=R0&&R0.status;
